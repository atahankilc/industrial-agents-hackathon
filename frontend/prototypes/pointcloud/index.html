<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point Cloud Building</title>
<style>
  :root { --bg: #05070d; --panel: rgba(12, 17, 30, 0.86); --text: #d7e3ff; --muted: #7d8bb0; --accent: #6fd3ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 270px; max-height: calc(100% - 24px); overflow: auto;
    background: var(--panel); border: 1px solid rgba(111, 211, 255, 0.18); border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(6px); }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .muted { color: var(--muted); font-size: 12px; }
  label { display: block; margin-top: 10px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=text] { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid rgba(111, 211, 255, 0.25); background: #0b1020; color: var(--text); }
  button { margin-top: 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(111, 211, 255, 0.35);
    background: #0f1a33; color: var(--text); cursor: pointer; }
  button:hover { background: #16264a; }
  #floors label { display: inline-flex; gap: 4px; margin: 4px 10px 0 0; }
  #legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; font-size: 12px; }
  #legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  #route { margin-top: 8px; font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) { #panel { left: 8px; right: 8px; width: auto; max-height: 45%; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <h1 id="title">Loading…</h1>
  <div class="muted" id="stats"></div>
  <div id="legend"></div>
  <button id="replay">▶ Replay emergence</button>
  <label>Density <span class="muted" id="densityValue"></span>
    <input id="density" type="range" min="0.02" max="1" step="0.01" value="1"></label>
  <label>Floor separation <span class="muted" id="explodeValue"></span>
    <input id="explode" type="range" min="0" max="25" step="0.5" value="0"></label>
  <label>Point size <input id="size" type="range" min="0.5" max="5" step="0.1" value="2.2"></label>
  <div id="floors"></div>
  <label>Highlight room <input id="search" type="text" placeholder="name, number or id — e.g. 2.03"></label>
  <div class="muted" id="match"></div>
  <label><input id="showRoute" type="checkbox" checked> Show route</label>
  <div id="route"></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const KIND_COLORS = { wall: "#6fd3ff", floor: "#3a5fa8", door: "#ffb347", core: "#ff5cc8", asset: "#7dff9a" };
const MAX_FLOORS = 16;
const EMERGE_SECONDS = 4.0;

const FOV_DEG = 50;
const projectionScale = () => innerHeight / (2 * Math.tan((FOV_DEG * Math.PI) / 360));
const params = new URLSearchParams(location.search);
const data = await (await fetch(params.get("data") || "sample.json")).json();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05070d);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.004);
const camera = new THREE.PerspectiveCamera(FOV_DEG, innerWidth / innerHeight, 0.1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ---------- point cloud ----------
const points = data.points;
const count = data.count;
const position = new Float32Array(count * 3);
const scatter = new Float32Array(count * 3);
const kindAttr = new Float32Array(count);
const floorAttr = new Float32Array(count);
const spaceAttr = new Float32Array(count);
const revealAttr = new Float32Array(count);
let maxExtent = 1;
for (let i = 0; i < count; i++) {
  for (let a = 0; a < 3; a++) position[i * 3 + a] = points.position_cm[i * 3 + a] / 100;
  maxExtent = Math.max(maxExtent, Math.abs(position[i * 3]), Math.abs(position[i * 3 + 2]));
  kindAttr[i] = points.kind[i];
  floorAttr[i] = points.floor[i];
  spaceAttr[i] = points.space[i];
  revealAttr[i] = points.reveal[i] / 255;
}
// Deterministic scatter: each point starts on a noisy shell around the building and flies home.
let seed = 1;
const random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < count; i++) {
  const r = maxExtent * (0.6 + random() * 0.9), theta = random() * Math.PI * 2, phi = Math.acos(2 * random() - 1);
  scatter[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  scatter[i * 3 + 1] = Math.abs(r * Math.cos(phi)) * 0.6;
  scatter[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(position, 3));
geometry.setAttribute("aScatter", new THREE.BufferAttribute(scatter, 3));
geometry.setAttribute("aKind", new THREE.BufferAttribute(kindAttr, 1));
geometry.setAttribute("aFloor", new THREE.BufferAttribute(floorAttr, 1));
geometry.setAttribute("aSpace", new THREE.BufferAttribute(spaceAttr, 1));
geometry.setAttribute("aReveal", new THREE.BufferAttribute(revealAttr, 1));

const kindColors = data.kinds.map((kind) => new THREE.Color(KIND_COLORS[kind] || "#ffffff"));
const floorOn = new Array(MAX_FLOORS).fill(1);
const uniforms = {
  uTime: { value: 0 }, uEmerge: { value: 0 }, uDensity: { value: 1 }, uExplode: { value: 0 },
  uSize: { value: 2.2 }, uScale: { value: projectionScale() }, uHighlight: { value: -1 },
  uFloorOn: { value: floorOn }, uKindColors: { value: kindColors },
};
const material = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */ `
    uniform float uTime, uEmerge, uDensity, uExplode, uSize, uScale, uHighlight;
    uniform float uFloorOn[${MAX_FLOORS}];
    uniform vec3 uKindColors[5];
    attribute vec3 aScatter;
    attribute float aKind, aFloor, aSpace, aReveal;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float visible = step(aReveal, uDensity) * uFloorOn[int(aFloor)];
      // Staggered convergence: low-reveal points arrive first, so structure emerges and then densifies.
      float t = clamp(uEmerge * 1.8 - aReveal * 0.8, 0.0, 1.0);
      float eased = 1.0 - pow(1.0 - t, 3.0);
      vec3 target = position + vec3(0.0, aFloor * uExplode, 0.0);
      vec3 drift = vec3(sin(uTime * 0.7 + aReveal * 40.0), cos(uTime * 0.5 + aReveal * 30.0), 0.0) * 0.6;
      vec3 p = mix(aScatter + drift * 6.0, target, eased);
      bool lit = abs(aSpace - uHighlight) < 0.5;
      vec3 base = uKindColors[int(aKind)];
      vColor = lit ? mix(base, vec3(1.0, 0.92, 0.55), 0.75) * 1.8 : base;
      vAlpha = (lit ? 1.0 : (uHighlight < 0.0 ? 0.9 : 0.22)) * (0.35 + 0.65 * eased);
      if (aKind == 1.0) vAlpha *= 0.6;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      // uSize ~ world diameter in decimetres; never thinner than ~1.5 px so far views still read.
      gl_PointSize = max(1.5, uSize * 0.1 * (lit ? 1.8 : 1.0) * uScale / -mv.z) * visible;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */ `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float glow = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vColor * glow, vAlpha * glow);
    }`,
});
scene.add(new THREE.Points(geometry, material));

// ---------- route as flowing particles ----------
const ROUTE_PARTICLES = 500;
let route = null;
if (data.route) {
  const vertices = data.route.vertices; // [x, y, z, floorIndex] in viewer frame
  const routePositions = new Float32Array(ROUTE_PARTICLES * 3);
  const routeGeometry = new THREE.BufferGeometry();
  routeGeometry.setAttribute("position", new THREE.BufferAttribute(routePositions, 3));
  const routeMaterial = new THREE.PointsMaterial({
    color: 0xfff1a8, size: 0.45, sizeAttenuation: true, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const lineGeometry = new THREE.BufferGeometry();
  const line = new THREE.Line(lineGeometry, new THREE.LineBasicMaterial({ color: 0xffd36e, transparent: true, opacity: 0.35 }));
  const particles = new THREE.Points(routeGeometry, routeMaterial);
  scene.add(line, particles);
  route = { vertices, routePositions, routeGeometry, lineGeometry, line, particles, cumulative: [], total: 0, world: [] };
  document.getElementById("route").innerHTML =
    `<b>Route</b> ${data.route.from.split(" [")[0]} → ${data.route.to.split(" [")[0]}<br>` +
    `${data.route.length_m} m (exact route model)${data.route.step_free ? ", step-free" : ""}`;
}

function layoutRoute() {
  if (!route) return;
  route.world = route.vertices.map(([x, y, z, f]) => new THREE.Vector3(x, y + f * uniforms.uExplode.value, z));
  route.cumulative = [0];
  for (let i = 1; i < route.world.length; i++) {
    route.cumulative.push(route.cumulative[i - 1] + route.world[i].distanceTo(route.world[i - 1]));
  }
  route.total = route.cumulative[route.cumulative.length - 1] || 1;
  route.lineGeometry.setFromPoints(route.world);
}

function pointAlongRoute(distance, out) {
  const c = route.cumulative;
  let i = 1;
  while (i < c.length - 1 && c[i] < distance) i++;
  const t = (distance - c[i - 1]) / Math.max(c[i] - c[i - 1], 1e-6);
  return out.lerpVectors(route.world[i - 1], route.world[i], Math.min(Math.max(t, 0), 1));
}

// ---------- UI ----------
const $ = (id) => document.getElementById(id);
$("title").textContent = data.building.name;
$("stats").textContent = `${data.building.id} · ${data.floors.length} floor(s) · ${count.toLocaleString()} points`;
if (data.building.attribution) $("stats").textContent += ` · ${data.building.attribution}`;
$("legend").innerHTML = data.kinds.map((k) => `<span><i style="background:${KIND_COLORS[k]}"></i>${k}</span>`).join("");
$("floors").innerHTML = data.floors.map((f, i) =>
  `<label><input type="checkbox" data-floor="${i}" checked>${f.level}</label>`).join("");
$("floors").addEventListener("change", (event) => {
  floorOn[Number(event.target.dataset.floor)] = event.target.checked ? 1 : 0;
});
const updateLabels = () => {
  $("densityValue").textContent = `${Math.round(uniforms.uDensity.value * 100)}%`;
  $("explodeValue").textContent = `${uniforms.uExplode.value} m`;
};
$("density").addEventListener("input", (e) => { uniforms.uDensity.value = Number(e.target.value); updateLabels(); });
$("explode").addEventListener("input", (e) => { uniforms.uExplode.value = Number(e.target.value); layoutRoute(); updateLabels(); });
$("size").addEventListener("input", (e) => { uniforms.uSize.value = Number(e.target.value); });
$("showRoute").addEventListener("change", (e) => { if (route) route.line.visible = route.particles.visible = e.target.checked; });
let emergeStart = performance.now();
$("replay").addEventListener("click", () => { emergeStart = performance.now(); });

const focusTarget = new THREE.Vector3();
$("search").addEventListener("input", (event) => {
  const query = event.target.value.trim().toLowerCase();
  if (!query) { uniforms.uHighlight.value = -1; $("match").textContent = ""; return; }
  const index = data.spaces.findIndex((s) =>
    s.ref.toLowerCase() === query || s.id.toLowerCase() === query || s.name.toLowerCase().includes(query));
  uniforms.uHighlight.value = index;
  if (index < 0) { $("match").textContent = "no match"; return; }
  const space = data.spaces[index];
  $("match").textContent = `${space.name} · ${data.floors[space.floor].name}`;
  const [x, y] = space.anchor;
  focusTarget.set(x - data.center[0], data.floors[space.floor].elevation_m + space.floor * uniforms.uExplode.value, -y - data.center[1]);
  controls.target.copy(focusTarget);
});
updateLabels();

// ---------- camera + loop ----------
const topY = Math.max(...data.floors.map((f) => f.elevation_m)) + 3;
camera.position.set(maxExtent * 1.1, topY + maxExtent * 0.9, maxExtent * 1.3);
controls.target.set(0, topY / 3, 0);
layoutRoute();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uScale.value = projectionScale();
});

const tmp = new THREE.Vector3();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const elapsed = clock.getElapsedTime();
  uniforms.uTime.value = elapsed;
  uniforms.uEmerge.value = Math.min((performance.now() - emergeStart) / 1000 / EMERGE_SECONDS, 1);
  if (route && route.particles.visible) {
    const speed = 6; // metres per second along the drawn path
    for (let i = 0; i < ROUTE_PARTICLES; i++) {
      const d = ((i / ROUTE_PARTICLES) * route.total + elapsed * speed) % route.total;
      pointAlongRoute(d, tmp);
      route.routePositions.set([tmp.x, tmp.y + Math.sin(elapsed * 4 + i) * 0.08, tmp.z], i * 3);
    }
    route.routeGeometry.attributes.position.needsUpdate = true;
    route.particles.material.opacity = uniforms.uEmerge.value;
    route.line.material.opacity = 0.35 * uniforms.uEmerge.value;
  }
  controls.update();
  renderer.render(scene, camera);
});
window.__pointcloud = { count, floors: data.floors.length, uniforms };
</script>
</body>
</html>
