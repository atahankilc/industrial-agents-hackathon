[project]
name = "steward"
version = "0.1.0"
description = "Steward: talk to your building. Agent-first indoor navigation and building management"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.2",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
