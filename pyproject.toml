[project]
name = "talk-to-your-building"
version = "0.1.0"
description = "Talk to Your Building: agent-first indoor navigation (Industrial Agents Hackathon 2026, Track 01)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agent", "benchmark"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
